<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Number OCR Search</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    padding:20px;
    background:#f5f5f5;
}

h2{
    text-align:center;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

input[type="text"]{
    padding:10px;
    width:250px;
}

table{
    border-collapse:collapse;
    width:100%;
    background:white;
}

td{
    border:1px solid #ccc;
    text-align:center;
    padding:8px;
    min-width:60px;
}

.highlight{
    background:yellow;
}
</style>
</head>
<body>

<h2>OCR 3D Search System</h2>

<div class="controls">
    <input type="file" id="upload" accept="image/*">
    <input type="text" id="search" placeholder="Search">
</div>

<p id="status"></p>

<table id="table"></table>

<script src="script.js"></script>

</body>
</html>
