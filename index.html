<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24 Row Auto Fill Table</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>24 Row Auto Fill Table</h1>
        <p>Upload Excel, edit cells, and the table will auto-fill repeated patterns.</p>
      </div>

      <div class="controls">
        <label class="file-btn">
          Upload Excel
          <input id="fileInput" type="file" accept=".xlsx,.xls" hidden />
        </label>
        <button id="addColumnBtn" class="btn btn-green">+ Column</button>
        <button id="exportBtn" class="btn btn-blue">Export Excel</button>
        <button id="clearBtn" class="btn btn-dark">Clear</button>
      </div>
    </header>

    <section class="statusbar">
      <div class="pill" id="statusText">Ready</div>
      <div class="pill" id="fileText">File: -</div>
      <div class="pill" id="colText">Columns: 3</div>
    </section>

    <main class="table-wrap">
      <table id="table"></table>
    </main>

    <footer class="note">
      24 rows fixed. Columns can grow unlimited. Auto-fill uses repeated-value gap pattern.
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
