<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 100%;
            overflow-x: auto;
            padding: 10px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .group-container {
            margin-bottom: 30px;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
        }
        .group-title {
            background-color: #8B0000; /* Dark Red */
            color: white;
            font-weight: bold;
            padding: 10px;
            text-align: center;
            font-size: 1.2em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
            white-space: nowrap;
        }
        th {
            background-color: #A52A2A; /* Red */
            color: white;
            font-weight: bold;
        }
        .no-column {
            background-color: #FFC0CB; /* Light Pink */
            font-weight: bold;
        }
        input[type="number"] {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
            border: none;
            text-align: center;
            background-color: transparent;
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .predicted-cell {
            background-color: #E0FFFF; /* Light Cyan */
        }
        .clear-button-container {
            text-align: center;
            padding: 10px;
            background-color: #fff;
            border-top: 1px solid #ccc;
        }
        .clear-button {
            padding: 8px 15px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }
        .clear-button:hover {
            background-color: #c82333;
        }

        /* Responsive design for Android phones */
        @media (max-width: 600px) {
            body {
                font-size: 14px;
            }
            th, td {
                padding: 6px;
            }
            .group-title {
                font-size: 1em;
            }
            .clear-button {
                padding: 6px 12px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <h1>Prediction Calculator</h1>

    <div class="container">
        <div class="group-container">
            <div class="group-title">Group A</div>
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>24</th>
                        <th>25</th>
                        <th>26</th>
                    </tr>
                </thead>
                <tbody id="groupA-body">
                    <!-- Rows will be generated by JavaScript -->
                </tbody>
            </table>
            <div class="clear-button-container">
                <button class="clear-button" onclick="clearGroup('A')">Clear All Group A</button>
            </div>
        </div>

        <div class="group-container">
            <div class="group-title">Group B</div>
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>24</th>
                        <th>25</th>
                        <th>26</th>
                    </tr>
                </thead>
                <tbody id="groupB-body">
                    <!-- Rows will be generated by JavaScript -->
                </tbody>
            </table>
            <div class="clear-button-container">
                <button class="clear-button" onclick="clearGroup('B')">Clear All Group B</button>
            </div>
        </div>
    </div>

    <script>
        const NUM_ROWS = 24;
        const NUM_COLS = 3; // 24, 25, 26

        function createTableRows(groupId) {
            const tbody = document.getElementById(`group${groupId}-body`);
            for (let i = 1; i <= NUM_ROWS; i++) {
                const row = tbody.insertRow();
                row.innerHTML = `<td class="no-column">${i}</td>`;
                for (let j = 0; j < NUM_COLS; j++) {
                    const cell = row.insertCell();
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.min = '0';
                    input.dataset.group = groupId;
                    input.dataset.row = i;
                    input.dataset.col = j;
                    input.addEventListener('input', handleInput);
                    cell.appendChild(input);
                }
            }
        }

        const groupData = {
            'A': {}, // Stores input values and prediction patterns for Group A
            'B': {}  // Stores input values and prediction patterns for Group B
        };

        function handleInput(event) {
            const input = event.target;
            const groupId = input.dataset.group;
            const row = parseInt(input.dataset.row);
            const col = parseInt(input.dataset.col);
            const value = input.value === '' ? null : parseInt(input.value);

            // Clear previous predictions for this group
            clearPredictions(groupId);

            // Update groupData with current input
            if (!groupData[groupId][value]) {
                groupData[groupId][value] = { occurrences: [], predictions: [] };
            }
            // Remove old occurrence if value changed or input cleared
            groupData[groupId][value].occurrences = groupData[groupId][value].occurrences.filter(occ => !(occ.row === row && occ.col === col));
            if (value !== null) {
                groupData[groupId][value].occurrences.push({ row, col });
                groupData[groupId][value].occurrences.sort((a, b) => {
                    if (a.col !== b.col) return a.col - b.col;
                    return a.row - b.row;
                });
            }

            // Re-evaluate predictions for all numbers in the group
            for (const num in groupData[groupId]) {
                if (groupData[groupId].hasOwnProperty(num)) {
                    predictPattern(groupId, parseInt(num));
                }
            }
            applyPredictions(groupId);
        }

        function predictPattern(groupId, number) {
            const data = groupData[groupId][number];
            if (!data || data.occurrences.length < 2) {
                data.predictions = [];
                return;
            }

            const firstColOccurrences = data.occurrences.filter(occ => occ.col === 0);

            if (firstColOccurrences.length < 2) {
                data.predictions = [];
                return;
            }

            // Sort occurrences by row for gap calculation
            firstColOccurrences.sort((a, b) => a.row - b.row);

            const firstOcc = firstColOccurrences[0];
            const secondOcc = firstColOccurrences[1];
            const gap = secondOcc.row - firstOcc.row;

            if (gap <= 0) {
                data.predictions = [];
                return;
            }

            data.predictions = [];
            let lastOcc = firstColOccurrences[firstColOccurrences.length - 1];

            // Start predicting from the last occurrence in the first column
            let currentRow = lastOcc.row;
            let currentCol = lastOcc.col;

            // Predict up to 3 columns
            for (let c = 0; c < NUM_COLS; c++) {
                if (c < currentCol) continue; // Skip columns before the last occurrence's column

                while (true) {
                    currentRow += gap;

                    let predictedRow = currentRow;
                    let predictedCol = currentCol;

                    if (predictedRow > NUM_ROWS) {
                        predictedRow -= NUM_ROWS;
                        predictedCol++;
                        currentRow = predictedRow; // Reset currentRow for the next column
                    }

                    if (predictedCol >= NUM_COLS) {
                        break; // Stop if past the 3rd column
                    }

                    // Check if this predicted cell is already an input for the current number
                    const isExistingInput = data.occurrences.some(occ => occ.row === predictedRow && occ.col === predictedCol);
                    if (!isExistingInput) {
                        data.predictions.push({ row: predictedRow, col: predictedCol, value: number });
                    }

                    // If we moved to a new column, reset currentRow to the predictedRow for that column
                    if (predictedCol > currentCol) {
                        currentCol = predictedCol;
                        break; // Move to the next column's prediction loop
                    }
                }
            }
        }

        function applyPredictions(groupId) {
            // Clear all existing prediction highlights first
            document.querySelectorAll(`#group${groupId}-body input`).forEach(input => {
                input.closest('td').classList.remove('predicted-cell');
                if (input.dataset.isPredicted === 'true') {
                    input.value = '';
                    input.dataset.isPredicted = 'false';
                }
            });

            for (const num in groupData[groupId]) {
                if (groupData[groupId].hasOwnProperty(num)) {
                    const data = groupData[groupId][num];
                    data.predictions.forEach(p => {
                        const input = document.querySelector(
                            `#group${groupId}-body input[data-row="${p.row}"][data-col="${p.col}"]`
                        );
                        if (input && input.value === '') {
                            input.value = p.value;
                            input.closest('td').classList.add('predicted-cell');
                            input.dataset.isPredicted = 'true';
                        }
                    });
                }
            }
        }

        function clearPredictions(groupId) {
            document.querySelectorAll(`#group${groupId}-body input`).forEach(input => {
                if (input.dataset.isPredicted === 'true') {
                    input.value = '';
                    input.closest('td').classList.remove('predicted-cell');
                    input.dataset.isPredicted = 'false';
                }
            });
        }

        function clearGroup(groupId) {
            document.querySelectorAll(`#group${groupId}-body input`).forEach(input => {
                input.value = '';
                input.closest('td').classList.remove('predicted-cell');
                input.dataset.isPredicted = 'false';
            });
            groupData[groupId] = {}; // Clear all stored data for the group
        }

        // Initialize tables on page load
        document.addEventListener('DOMContentLoaded', () => {
            createTableRows('A');
            createTableRows('B');
        });
    </script>
</body>
</html>
