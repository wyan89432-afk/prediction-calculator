<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            color: #111827;
        }
        
        .subtitle {
            text-align: center;
            color: #4b5563;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        
        .group-section {
            margin-bottom: 40px;
        }
        
        .group-header {
            background-color: #991b1b;
            color: white;
            padding: 15px;
            border-radius: 8px 8px 0 0;
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .group-content {
            background-color: white;
            border: 1px solid #d1d5db;
            border-radius: 0 0 8px 8px;
            padding: 20px;
        }
        
        .search-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        
        .search-field {
            flex: 1;
            min-width: 200px;
        }
        
        .search-field label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #374151;
        }
        
        .search-field input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        .search-hint {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 4px;
        }
        
        .search-results {
            background-color: #f0f0f0;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            min-height: 24px;
            color: #374151;
            max-height: 250px;
            overflow-y: auto;
        }
        
        .button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .button-primary {
            background-color: #dc2626;
            color: white;
        }
        
        .button-primary:hover {
            background-color: #b91c1c;
        }
        
        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        
        th, td {
            border: 1px solid #d1d5db;
            padding: 8px;
            text-align: center;
            position: relative;
            height: 40px;
        }
        
        th {
            background-color: #b91c1c;
            color: white;
            font-weight: 600;
        }
        
        td {
            background-color: #fce7f3;
        }
        
        td:first-child {
            background-color: #fbcfe8;
            font-weight: 600;
            width: 50px;
        }
        
        input[type="number"] {
            width: 100%;
            height: 100%;
            padding: 0;
            border: none;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            background: transparent;
        }
        
        input[type="number"]:focus {
            outline: none;
            background-color: rgba(153, 27, 27, 0.1);
        }
        
        .cell-predicted {
            background-color: #a5f3fc !important;
        }
        
        .cell-normal {
            background-color: #fed7aa !important;
        }
        
        .cell-above-10 {
            background-color: #9ca3af !important;
            color: white;
        }
        
        .cell-digit-removed {
            background-color: #dbeafe !important;
            color: #1e40af;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .arrow-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            font-size: 1.3rem;
            font-weight: bold;
        }
        
        .arrow-yellow { color: #fbbf24; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .arrow-green { color: #4ade80; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .arrow-red { color: #ef4444; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .arrow-blue { color: #3b82f6; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        
        .add-column-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .add-column-btn:hover {
            background-color: #16a34a;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .back-button {
            padding: 10px 20px;
            background-color: #6b7280;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .back-button:hover {
            background-color: #4b5563;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.75rem;
            }
            
            table {
                font-size: 0.75rem;
            }
            
            th, td {
                padding: 4px;
            }
            
            .search-container {
                flex-direction: column;
            }
            
            .search-field {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prediction Calculator</h1>
        <p class="subtitle">Analyze number patterns with dynamic columns and gap visualization</p>
        
        <div id="app"></div>
    </div>
    
    <script>
        class PredictionCalculator {
            constructor() {
                this.NUM_ROWS = 24;
                this.INITIAL_COLUMNS = [24, 25, 26];
                
                this.digitGroups = {
                    "1": ["01", "10", "12", "21", "23", "32", "34", "43", "45", "54", "56", "65", "67", "76", "78", "87", "89", "98", "90", "09"],
                    "2": ["02", "20", "13", "31", "24", "42", "35", "53", "46", "64", "57", "75", "68", "86", "79", "97", "80", "08"],
                    "3": ["03", "30", "14", "41", "25", "52", "36", "63", "47", "74", "58", "85", "69", "96", "70", "07"],
                    "4": ["04", "40", "15", "51", "26", "62", "37", "73", "48", "84", "59", "95", "60", "06"],
                    "5": ["05", "50", "16", "61", "27", "72", "38", "83", "49", "94"],
                    "6": ["06", "60", "17", "71", "28", "82", "39", "93", "40", "04"],
                    "7": ["07", "70", "18", "81", "29", "92", "30", "03"],
                    "8": ["08", "80", "19", "91", "20", "02"],
                    "9": ["09", "90"],
                };
                
                this.groupA = this.initializeGroup();
                this.groupB = this.initializeGroup();
                
                this.render();
            }
            
            initializeGroup() {
                return {
                    columns: [...this.INITIAL_COLUMNS],
                    rows: Array(this.NUM_ROWS).fill(null).map(() => Array(3).fill(null)),
                    data: {},
                    pastedNumbers: [],
                    searchResults: '',
                    searchValue: '',
                    gapHighlights: {},
                    digitModified: {},
                    autoFilled: new Set()
                };
            }
            
            getPositionFromLinearIndex(linearIndex, numRows) {
                const col = Math.floor((linearIndex - 1) / numRows);
                const row = ((linearIndex - 1) % numRows) + 1;
                return { col, row };
            }
            
            getLinearIndex(row, col, numRows) {
                return col * numRows + row;
            }
            
            updateGroupData(group) {
                group.data = {};
                group.pastedNumbers = [];
                
                for (let r = 0; r < this.NUM_ROWS; r++) {
                    for (let c = 0; c < group.columns.length; c++) {
                        const val = group.rows[r][c];
                        if (val !== null) {
                            if (!group.data[val]) {
                                group.data[val] = { occurrences: [] };
                            }
                            group.data[val].occurrences.push({ row: r + 1, col: c });
                            
                            if (!group.pastedNumbers.includes(val)) {
                                group.pastedNumbers.push(val);
                            }
                        }
                    }
                }
                
                // Sort occurrences by linear index
                for (const val in group.data) {
                    group.data[val].occurrences.sort((a, b) => 
                        this.getLinearIndex(a.row, a.col, this.NUM_ROWS) - 
                        this.getLinearIndex(b.row, b.col, this.NUM_ROWS)
                    );
                }
            }
            
            handleCellChange(group, rowIdx, colIdx, value) {
                const num = value === '' ? null : parseInt(value, 10);
                
                // 1. Update the cell the user changed
                group.rows[rowIdx][colIdx] = num;
                
                // If user manually changed an auto-filled cell, it's no longer auto-filled
                group.autoFilled.delete(`${rowIdx + 1}-${colIdx}`);

                if (num !== null) {
                    // 2. Update data to find patterns
                    this.updateGroupData(group);

                    // 3. Calculate and APPLY auto-fill based on the changed number
                    const data = group.data[num];
                    if (data && data.occurrences.length >= 2) {
                        // Use the first two occurrences to define the gap (as per VBA logic)
                        const pos1 = this.getLinearIndex(data.occurrences[0].row, data.occurrences[0].col, this.NUM_ROWS);
                        const pos2 = this.getLinearIndex(data.occurrences[1].row, data.occurrences[1].col, this.NUM_ROWS);
                        const gap = pos2 - pos1;
                        
                        if (gap > 0) {
                            // Start predicting from the last known occurrence
                            let lastOcc = data.occurrences[data.occurrences.length - 1];
                            let currentPos = this.getLinearIndex(lastOcc.row, lastOcc.col, this.NUM_ROWS);
                            const maxPos = group.columns.length * this.NUM_ROWS;
                            
                            while (true) {
                                currentPos += gap;
                                if (currentPos > maxPos) break;
                                
                                const { col, row } = this.getPositionFromLinearIndex(currentPos, this.NUM_ROWS);
                                
                                // Only fill if the cell is empty
                                if (group.rows[row - 1][col] === null) {
                                    group.rows[row - 1][col] = num;
                                    group.autoFilled.add(`${row}-${col}`);
                                } else if (group.rows[row - 1][col] !== num) {
                                    // If we hit a different number, stop predicting for this pattern
                                    break;
                                }
                                // If it's already the same number, just continue
                            }
                        }
                    }
                }
                
                // 4. Final data update and render
                this.updateGroupData(group);
                this.render();
            }
            
            handleSearch(group, input) {
                group.searchValue = input;
                group.gapHighlights = {};
                group.digitModified = {};
                
                if (!input) {
                    group.searchResults = '';
                    this.render();
                    return;
                }
                
                if (input.startsWith('=')) {
                    this.handleGapSearch(group, input.substring(1));
                } else {
                    this.handleDigitSearch(group, input);
                }
            }
            
            handleGapSearch(group, gapStr) {
                const searchGap = parseInt(gapStr, 10);
                if (isNaN(searchGap) || searchGap < 1 || searchGap > 60) {
                    group.searchResults = 'Please enter a number between 1 and 60 for gap search (e.g., =5).';
                    this.render();
                    return;
                }
                
                const gapMatches = [];
                const arrowColors = ['yellow', 'green', 'red', 'blue'];
                let colorIndex = 0;
                
                for (const numStr in group.data) {
                    const num = parseInt(numStr);
                    const data = group.data[num];
                    if (!data || data.occurrences.length < 2) continue;
                    
                    for (let i = 0; i < data.occurrences.length - 1; i++) {
                        const pos1 = this.getLinearIndex(data.occurrences[i].row, data.occurrences[i].col, this.NUM_ROWS);
                        const pos2 = this.getLinearIndex(data.occurrences[i+1].row, data.occurrences[i+1].col, this.NUM_ROWS);
                        
                        if (pos2 - pos1 === searchGap) {
                            const color = arrowColors[colorIndex % arrowColors.length];
                            colorIndex++;
                            
                            gapMatches.push({
                                number: num,
                                from: data.occurrences[i],
                                to: data.occurrences[i+1],
                                color: color
                            });
                            
                            for (let p = pos1 + 1; p < pos2; p++) {
                                const pos = this.getPositionFromLinearIndex(p, this.NUM_ROWS);
                                group.gapHighlights[`${pos.row}-${pos.col}`] = color;
                            }
                        }
                    }
                }
                
                if (gapMatches.length > 0) {
                    let resultsHtml = `<strong>Found ${gapMatches.length} patterns with gap ${searchGap}:</strong><br>`;
                    gapMatches.forEach(match => {
                        resultsHtml += `<div style="margin: 4px 0; padding: 4px; border-left: 4px solid ${match.color}; background: #f9fafb;">
                            Number <strong>${match.number}</strong>: Pos (${match.from.row}, ${group.columns[match.from.col]}) to (${match.to.row}, ${group.columns[match.to.col]})
                        </div>`;
                    });
                    group.searchResults = resultsHtml;
                } else {
                    group.searchResults = `No patterns found with gap ${searchGap}.`;
                }
                
                this.render();
            }
            
            handleDigitSearch(group, digit) {
                if (!digit || digit < '1' || digit > '9') {
                    group.searchResults = 'Please enter a digit 1-9 for search.';
                    this.render();
                    return;
                }
                
                const targetPairs = this.digitGroups[digit];
                const foundPairs = new Set();
                const matchedNumbers = [];
                const matchDetails = [];
                
                group.pastedNumbers.forEach((num) => {
                    const numStr = String(num).padStart(3, '0');
                    const d0 = numStr[0];
                    const d1 = numStr[1];
                    const d2 = numStr[2];
                    
                    const combinations = [
                        { pair: d0 + d1, remaining: d2 },
                        { pair: d1 + d2, remaining: d0 },
                        { pair: d0 + d2, remaining: d1 }
                    ];
                    
                    combinations.forEach((combo) => {
                        if (targetPairs.includes(combo.pair)) {
                            foundPairs.add(combo.pair);
                            const reverse = combo.pair[1] + combo.pair[0];
                            foundPairs.add(reverse);
                            
                            if (!matchedNumbers.includes(num)) {
                                matchedNumbers.push(num);
                            }
                            
                            matchDetails.push({
                                number: num,
                                pair: combo.pair,
                                remaining: combo.remaining
                            });
                        }
                    });
                });
                
                if (matchedNumbers.length > 0) {
                    matchedNumbers.forEach((num) => {
                        const numStr = String(num).padStart(3, '0');
                        const d0 = numStr[0];
                        const d1 = numStr[1];
                        const d2 = numStr[2];
                        const combinations = [
                            { pair: d0 + d1, remaining: d2 },
                            { pair: d1 + d2, remaining: d0 },
                            { pair: d0 + d2, remaining: d1 }
                        ];
                        
                        for (let r = 0; r < this.NUM_ROWS; r++) {
                            for (let c = 0; c < group.columns.length; c++) {
                                if (group.rows[r][c] === num) {
                                    for (let combo of combinations) {
                                        if (targetPairs.includes(combo.pair)) {
                                            group.digitModified[`${r + 1}-${c}`] = combo.remaining;
                                            break;
