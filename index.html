<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24 Row OCR Auto Fill Table</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title-block">
        <h1>24 Row OCR Auto Fill Table</h1>
        <p>Upload a picture, OCR will read numbers, and the table will auto-fill by gap pattern.</p>
      </div>

      <div class="controls">
        <label class="file-btn">
          Upload Image
          <input id="fileInput" type="file" accept="image/*" hidden />
        </label>
        <button id="addColumnBtn" class="btn btn-green">+ Column</button>
        <button id="clearBtn" class="btn btn-dark">Clear</button>
      </div>
    </header>

    <section class="statusbar">
      <div class="pill" id="statusText">Ready</div>
      <div class="pill" id="fileText">File: -</div>
      <div class="pill" id="colText">Columns: 3</div>
      <div class="pill" id="ocrText">OCR: -</div>
    </section>

    <section class="preview-wrap">
      <img id="previewImage" class="preview-image hidden" alt="Uploaded preview" />
    </section>

    <main class="table-wrap">
      <table id="table"></table>
    </main>

    <footer class="note">
      24 rows fixed. Columns grow as needed. Edit cells manually anytime.
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
