<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            color: #111827;
        }
        
        .subtitle {
            text-align: center;
            color: #4b5563;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        
        .group-section {
            margin-bottom: 40px;
        }
        
        .group-header {
            background-color: #991b1b;
            color: white;
            padding: 15px;
            border-radius: 8px 8px 0 0;
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .group-content {
            background-color: white;
            border: 1px solid #d1d5db;
            border-radius: 0 0 8px 8px;
            padding: 20px;
        }
        
        .search-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        
        .search-field {
            flex: 1;
            min-width: 200px;
        }
        
        .search-field label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #374151;
        }
        
        .search-field input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        .search-results {
            background-color: #f0f0f0;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            min-height: 24px;
            color: #374151;
        }
        
        .button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .button-primary {
            background-color: #dc2626;
            color: white;
        }
        
        .button-primary:hover {
            background-color: #b91c1c;
        }
        
        .button-secondary {
            background-color: #e5e7eb;
            color: #1f2937;
        }
        
        .button-secondary:hover {
            background-color: #d1d5db;
        }
        
        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        
        th, td {
            border: 1px solid #d1d5db;
            padding: 10px;
            text-align: center;
        }
        
        th {
            background-color: #b91c1c;
            color: white;
            font-weight: 600;
        }
        
        td {
            background-color: #fce7f3;
        }
        
        td:first-child {
            background-color: #fbcfe8;
            font-weight: 600;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 6px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #991b1b;
            box-shadow: 0 0 0 3px rgba(153, 27, 27, 0.1);
        }
        
        .cell-predicted {
            background-color: #a5f3fc !important;
        }
        
        .cell-normal {
            background-color: #fed7aa !important;
        }
        
        .cell-above-10 {
            background-color: #9ca3af !important;
            color: white;
        }
        
        .add-column-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .add-column-btn:hover {
            background-color: #16a34a;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .back-button {
            padding: 10px 20px;
            background-color: #6b7280;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .back-button:hover {
            background-color: #4b5563;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.75rem;
            }
            
            table {
                font-size: 0.85rem;
            }
            
            th, td {
                padding: 6px;
            }
            
            .search-container {
                flex-direction: column;
            }
            
            .search-field {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prediction Calculator</h1>
        <p class="subtitle">Analyze number patterns with dynamic columns and gap visualization</p>
        
        <div id="app"></div>
    </div>
    
    <script>
        // Initialize the application
        class PredictionCalculator {
            constructor() {
                this.NUM_ROWS = 24;
                this.INITIAL_COLUMNS = [24, 25, 26];
                
                this.digitGroups = {
                    "1": ["01", "10", "12", "21", "23", "32", "34", "43", "45", "54", "56", "65", "67", "76", "78", "87", "89", "98", "90", "09"],
                    "2": ["02", "20", "13", "31", "24", "42", "35", "53", "46", "64", "57", "75", "68", "86", "79", "97", "80", "08"],
                    "3": ["03", "30", "14", "41", "25", "52", "36", "63", "47", "74", "58", "85", "69", "96", "70", "07"],
                    "4": ["04", "40", "15", "51", "26", "62", "37", "73", "48", "84", "59", "95", "60", "06"],
                    "5": ["05", "50", "16", "61", "27", "72", "38", "83", "49", "94"],
                    "6": ["06", "60", "17", "71", "28", "82", "39", "93", "40", "04"],
                    "7": ["07", "70", "18", "81", "29", "92", "30", "03"],
                    "8": ["08", "80", "19", "91", "20", "02"],
                    "9": ["09", "90"],
                };
                
                this.groupA = this.initializeGroup();
                this.groupB = this.initializeGroup();
                
                this.render();
            }
            
            initializeGroup() {
                return {
                    columns: this.INITIAL_COLUMNS,
                    rows: Array(this.NUM_ROWS).fill(null).map(() => Array(3).fill(null)),
                    data: {},
                    pastedNumbers: [],
                    searchResults: '',
                    searchValue: ''
                };
            }
            
            predictPattern(group, number) {
                const data = group.data[number];
                if (!data || data.occurrences.length < 2) return [];
                
                const predictions = [];
                const sortedOccurrences = [...data.occurrences].sort((a, b) => {
                    const posA = a.col * this.NUM_ROWS + a.row;
                    const posB = b.col * this.NUM_ROWS + b.row;
                    return posA - posB;
                });
                
                const firstOcc = sortedOccurrences[0];
                const secondOcc = sortedOccurrences[1];
                const posFirst = firstOcc.col * this.NUM_ROWS + firstOcc.row;
                const posSecond = secondOcc.col * this.NUM_ROWS + secondOcc.row;
                const gap = posSecond - posFirst;
                
                if (gap <= 0) return [];
                
                let lastOcc = sortedOccurrences[sortedOccurrences.length - 1];
                let currentPos = lastOcc.col * this.NUM_ROWS + lastOcc.row;
                
                const maxPos = group.columns.length * this.NUM_ROWS;
                while (true) {
                    currentPos += gap;
                    if (currentPos > maxPos) break;
                    
                    const predictedCol = Math.floor((currentPos - 1) / this.NUM_ROWS);
                    const predictedRow = ((currentPos - 1) % this.NUM_ROWS) + 1;
                    
                    const isExistingInput = data.occurrences.some(
                        (occ) => occ.row === predictedRow && occ.col === predictedCol
                    );
                    if (!isExistingInput) {
                        predictions.push({ row: predictedRow, col: predictedCol, value: number });
                    }
                }
                
                return predictions;
            }
            
            handleCellChange(group, rowIdx, colIdx, value) {
                const num = value === '' ? null : parseInt(value, 10);
                
                if (!group.rows[rowIdx]) {
                    group.rows[rowIdx] = Array(group.columns.length).fill(null);
                }
                group.rows[rowIdx][colIdx] = num;
                
                if (num !== null && num >= 100 && num <= 999) {
                    if (!group.pastedNumbers.includes(num)) {
                        group.pastedNumbers.push(num);
                    }
                }
                
                // Update data tracking
                for (const n in group.data) {
                    group.data[n].occurrences = group.data[n].occurrences.filter(
                        (occ) => !(occ.row === rowIdx + 1 && occ.col === colIdx)
                    );
                }
                
                if (num !== null) {
                    if (!group.data[num]) {
                        group.data[num] = { occurrences: [], predictions: [] };
                    }
                    group.data[num].occurrences.push({ row: rowIdx + 1, col: colIdx });
                    group.data[num].occurrences.sort((a, b) => {
                        if (a.col !== b.col) return a.col - b.col;
                        return a.row - b.row;
                    });
                }
                
                // Recalculate predictions
                for (const n in group.data) {
                    group.data[n].predictions = this.predictPattern(group, parseInt(n));
                }
                
                this.render();
            }
            
            handleSearch(group, digit) {
                if (!digit || digit < '1' || digit > '9') {
                    group.searchResults = '';
                    return;
                }
                
                const targetPairs = this.digitGroups[digit];
                const foundPairs = new Set();
                
                group.pastedNumbers.forEach((num) => {
                    const numStr = String(num).padStart(3, '0');
                    const d0 = numStr[0];
                    const d1 = numStr[1];
                    const d2 = numStr[2];
                    
                    const combinations = [d0 + d1, d1 + d2, d0 + d2];
                    
                    combinations.forEach((combo) => {
                        if (targetPairs.includes(combo)) {
                            foundPairs.add(combo);
                            const reverse = combo[1] + combo[0];
                            foundPairs.add(reverse);
                        }
                    });
                });
                
                if (foundPairs.size > 0) {
                    const sortedPairs = Array.from(foundPairs).sort();
                    group.searchResults = 'Found: ' + sortedPairs.join(', ');
                } else {
                    group.searchResults = 'No matching pairs found.';
                }
                
                this.render();
            }
            
            addColumn(group) {
                const newColNum = Math.max(...group.columns) + 1;
                group.columns.push(newColNum);
                group.rows = group.rows.map((row) => [...row, null]);
                this.render();
            }
            
            clearGroup(group) {
                group.columns = this.INITIAL_COLUMNS;
                group.rows = Array(this.NUM_ROWS).fill(null).map(() => Array(3).fill(null));
                group.data = {};
                group.pastedNumbers = [];
                group.searchResults = '';
                group.searchValue = '';
                this.render();
            }
            
            handlePaste(e, group, startRow, startCol) {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text');
                const rows = pasteData.split(/\r\n|\n|\r/).map((row) => row.split(/\t|\s+/));
                
                rows.forEach((colData, rIndex) => {
                    colData.forEach((cellValue, cIndex) => {
                        const targetRow = startRow + rIndex;
                        const targetCol = startCol + cIndex;
                        
                        if (targetRow < this.NUM_ROWS && targetCol < group.columns.length) {
                            const parsedValue = parseInt(cellValue.trim(), 10);
                            if (!isNaN(parsedValue)) {
                                this.handleCellChange(group, targetRow, targetCol, String(parsedValue));
                            }
                        }
                    });
                });
            }
            
            renderGroupTable(group, groupId) {
                let html = `
                    <div class="group-section">
                        <div class="group-header">Group ${groupId}</div>
                        <div class="group-content">
                            <div class="search-container">
                                <div class="search-field">
                                    <label>Search (1-9):</label>
                                    <input type="text" id="search${groupId}" placeholder="Enter digit" maxlength="1" value="${group.searchValue}">
                                </div>
                                <button class="button button-primary" onclick="app.clearGroup(app.group${groupId})">Clear All Group ${groupId}</button>
                            </div>
                            <div class="search-results">${group.searchResults}</div>
                            <div class="table-wrapper">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>No</th>
                `;
                
                group.columns.forEach((col) => {
                    html += `<th>${col}</th>`;
                });
                
                html += `
                                            <th><button class="add-column-btn" onclick="app.addColumn(app.group${groupId})">+</button></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                `;
                
                group.rows.forEach((row, rowIdx) => {
                    html += `<tr>
                        <td>${rowIdx + 1}</td>
                    `;
                    
                    row.forEach((value, colIdx) => {
                        const isPredicted = value !== null && group.data[value]?.predictions.some(
                            (p) => p.row === rowIdx + 1 && p.col === colIdx
                        );
                        
                        let cellClass = '';
                        if (isPredicted) {
                            cellClass = 'cell-predicted';
                        } else if (value !== null && value > 10) {
                            cellClass = 'cell-above-10';
                        } else if (value !== null) {
                            cellClass = 'cell-normal';
                        }
                        
                        html += `<td class="${cellClass}">
                            <input type="number" value="${value || ''}" 
                                onchange="app.handleCellChange(app.group${groupId}, ${rowIdx}, ${colIdx}, this.value)"
                                onpaste="app.handlePaste(event, app.group${groupId}, ${rowIdx}, ${colIdx})">
                        </td>`;
                    });
                    
                    html += `<td></td></tr>`;
                });
                
                html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
                
                return html;
            }
            
            render() {
                const appDiv = document.getElementById('app');
                let html = this.renderGroupTable(this.groupA, 'A') + this.renderGroupTable(this.groupB, 'B');
                
                html += `
                    <div class="button-group">
                        <button class="back-button" onclick="app.reset()">← Back / Reset All</button>
                    </div>
                `;
                
                appDiv.innerHTML = html;
                
                // Attach search listeners
                document.getElementById('searchA').addEventListener('input', (e) => {
                    this.groupA.searchValue = e.target.value;
                    this.handleSearch(this.groupA, e.target.value);
                });
                
                document.getElementById('searchB').addEventListener('input', (e) => {
                    this.groupB.searchValue = e.target.value;
                    this.handleSearch(this.groupB, e.target.value);
                });
            }
            
            reset() {
                this.groupA = this.initializeGroup();
                this.groupB = this.initializeGroup();
                this.render();
            }
        }
        
        const app = new PredictionCalculator();
    </script>
</body>
</html>
